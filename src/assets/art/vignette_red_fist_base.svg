  <!-- clenched fist -->
  <circle cx="110" cy="46" r="24" fill="#c0392b" stroke="#000000" stroke-width="3.6"/>
  <circle cx="94" cy="34" r="10" fill="#c0392b" stroke="#000000" stroke-width="3"/>
