<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="58" cy="163" rx="34" ry="6" fill="#000000" opacity="0.15"/>

  <!-- legs -->
  <rect x="36" y="116" width="17" height="40" rx="8" fill="#22233a" stroke="#000" stroke-width="3.5"/>
  <rect x="66" y="116" width="17" height="40" rx="8" fill="#22233a" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="44" cy="158" rx="13" ry="7" fill="#111111" stroke="#000" stroke-width="3.5"/>
  <ellipse cx="75" cy="158" rx="13" ry="7" fill="#111111" stroke="#000" stroke-width="3.5"/>

  <!-- lowered arm (fist on hip, smug) -->
  <path d="M34 74 Q18 92 24 116" fill="none" stroke="#1b2a52" stroke-width="15" stroke-linecap="round"/>
  <path d="M34 74 Q18 92 24 116" fill="none" stroke="#000" stroke-width="18" stroke-linecap="round" opacity="0" />
  <circle cx="23" cy="118" r="9.5" fill="#e0aa74" stroke="#000" stroke-width="3.5"/>

  <!-- suit body -->
  <path d="M32 68 Q59 54 87 68 L93 124 Q60 136 27 124 Z" fill="#1b2a52" stroke="#000" stroke-width="4"/>
  <!-- shirt V -->
  <path d="M49 66 L60 84 L71 66 L64 64 L60 71 L56 64 Z" fill="#f5f0e6" stroke="#000" stroke-width="2.5"/>
  <!-- tie -->
  <path d="M56 76 L64 76 L68 100 L60 114 L52 100 Z" fill="#b8332b" stroke="#000" stroke-width="2.5"/>
  <!-- lapel pin -->
  <circle cx="40" cy="80" r="4.5" fill="#c94a3a" stroke="#000" stroke-width="1.8"/>

  <!-- raised arm (pointing, corrupt-lecture pose) -->
  <path d="M85 74 Q108 62 114 40" fill="none" stroke="#1b2a52" stroke-width="15" stroke-linecap="round"/>
  <circle cx="115" cy="36" r="9.5" fill="#e0aa74" stroke="#000" stroke-width="3.5"/>
  <rect x="111" y="20" width="7" height="18" rx="3.5" fill="#e0aa74" stroke="#000" stroke-width="2.8"/>

  <!-- ears -->
  <circle cx="29" cy="45" r="7" fill="#e0aa74" stroke="#000" stroke-width="3.2"/>
  <circle cx="91" cy="45" r="7" fill="#e0aa74" stroke="#000" stroke-width="3.2"/>

  <!-- head -->
  <circle cx="60" cy="43" r="32" fill="#e0aa74" stroke="#000" stroke-width="4"/>

  <!-- hair -->
  <path d="M27 32 Q60 2 93 32 Q90 14 60 10 Q30 14 27 32 Z" fill="#161616" stroke="#000" stroke-width="3.2"/>
  <path d="M25 38 Q23 24 32 17" fill="none" stroke="#161616" stroke-width="7" stroke-linecap="round"/>
  <path d="M95 38 Q97 26 90 19" fill="none" stroke="#161616" stroke-width="7" stroke-linecap="round"/>

  <!-- eyebrows: angled, smug -->
  <path d="M40 36 Q49 29 58 35" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <path d="M62 35 Q71 29 80 36" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>

  <!-- eyes: half-closed / smug -->
  <path d="M42 45 Q50 41 58 45" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M62 45 Q70 41 78 45" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="50" cy="46" r="2.3" fill="#000"/>
  <circle cx="70" cy="46" r="2.3" fill="#000"/>

  <!-- nose -->
  <path d="M60 46 Q64 55 58 58" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

  <!-- mustache -->
  <path d="M46 60 Q60 67 74 60 Q60 63 46 60 Z" fill="#161616" stroke="#000" stroke-width="1.6"/>

  <!-- sly grin -->
  <path d="M46 65 Q60 74 76 63" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
