<svg viewBox="0 0 120 170" xmlns="http://www.w3.org/2000/svg">
  <!-- ground shadow -->
  <ellipse cx="60" cy="163" rx="32" ry="6" fill="#000000" opacity="0.15"/>

  <!-- trailing leg (back) -->
  <path d="M74 118 Q92 130 90 152" fill="none" stroke="#3a3b45" stroke-width="17" stroke-linecap="round"/>
  <ellipse cx="90" cy="155" rx="12" ry="7" fill="#111111" stroke="#000000" stroke-width="3"/>

  <!-- forward leg (bent knee raised) -->
  <path d="M50 118 Q33 128 40 146" fill="none" stroke="#3a3b45" stroke-width="17" stroke-linecap="round"/>
  <ellipse cx="40" cy="150" rx="12" ry="7" fill="#111111" stroke="#000000" stroke-width="3"/>

  <!-- back-swung arm (upper sleeve + forearm) -->
  <path d="M82 74 Q100 68 102 52" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <path d="M96 58 Q104 52 108 42" fill="none" stroke="#e0aa74" stroke-width="13" stroke-linecap="round"/>
  <circle cx="108" cy="41" r="8.5" fill="#e0aa74" stroke="#000000" stroke-width="3"/>

  <!-- forward-swung arm (upper sleeve + forearm) -->
  <path d="M38 74 Q22 82 22 98" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <path d="M24 92 Q18 100 24 112" fill="none" stroke="#e0aa74" stroke-width="13" stroke-linecap="round"/>
  <circle cx="24" cy="114" r="8.5" fill="#e0aa74" stroke="#000000" stroke-width="3"/>

  <!-- white shirt body, back view -->
  <path d="M34 66 Q60 52 86 66 L92 122 Q60 134 28 122 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- back seam -->
  <path d="M60 58 L60 128" fill="none" stroke="#d6d6d6" stroke-width="2.2"/>
  <!-- shirt fold shading -->
  <path d="M40 82 Q60 92 80 82" fill="none" stroke="#e6e6e6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M38 102 Q60 112 82 102" fill="none" stroke="#e6e6e6" stroke-width="2.4" stroke-linecap="round"/>

  <!-- collar -->
  <path d="M50 66 Q60 60 70 66 L66 71 Q60 67 54 71 Z" fill="#f6f6f6" stroke="#000000" stroke-width="2"/>

  <!-- ears -->
  <circle cx="31" cy="45" r="6.5" fill="#e0aa74" stroke="#000000" stroke-width="3"/>
  <circle cx="89" cy="45" r="6.5" fill="#e0aa74" stroke="#000000" stroke-width="3"/>

  <!-- head, back view -->
  <circle cx="60" cy="43" r="30" fill="#e0aa74" stroke="#000000" stroke-width="4"/>

  <!-- neck -->
  <rect x="50" y="58" width="20" height="14" rx="4" fill="#e0aa74" stroke="#000000" stroke-width="2"/>

  <!-- hair covering back/top of head -->
  <path d="M30 40 Q27 9 60 7 Q93 9 90 40 Q93 56 83 61 Q90 33 60 27 Q30 33 37 61 Q27 56 30 40 Z" fill="#161616" stroke="#000000" stroke-width="3"/>
</svg>
